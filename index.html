<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Routnow"><link rel="manifest" href="routnow.webmanifest"><link rel="apple-touch-icon" href="routnow-icon-final.png"><title>Routnow</title><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js')</script><style>body,main,.app,.row,input,.panel,.panel .primary,#save{background:#000!important}body{color:#fff!important}main{background:#000!important}
:root{--bg:#f5f1e9;--card:#fffdf8;--ink:#17202a;--muted:#6e7781;--line:#e9e3d8;--green:#20c588;--red:#dd554c;--gray:#e2e4e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 8% 10%,#f5d9b5,transparent 28rem),radial-gradient(circle at 92% 88%,#cce8d9,transparent 28rem)}.app{position:relative;width:min(680px,100%);min-height:410px;padding:48px;border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:0 24px 80px #0002}.eyebrow{color:#ba6b35;font-size:.72rem;letter-spacing:.15em;font-weight:800}.actions{position:absolute;top:48px;right:48px;display:flex;gap:9px}.round{border:0;border-radius:50%;width:38px;height:38px;background:var(--gray);color:#68727c;font-size:1.2rem;cursor:pointer}h1{font-size:3.35rem;letter-spacing:-.06em;line-height:1;margin:13px 0 0}p{color:var(--muted);margin:11px 0}.progress{display:flex;gap:12px;align-items:center;margin:30px 0 15px}.bar{height:9px;flex:1;background:#e8e4de;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:.2s}.hint{font-size:.8rem;margin:0 0 10px}ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}.task{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);touch-action:pan-y}.delete{position:absolute;inset:0 0 0 auto;width:96px;display:grid;place-items:center;background:var(--red);color:white;font-weight:800}.row{position:relative;display:flex;align-items:center;min-height:68px;padding:14px 12px 14px 16px;background:#fff;transition:transform .15s}.check{width:25px;height:25px;border:2px solid #bdc4c7;border-radius:50%;display:grid;place-items:center;color:white;font-weight:900;cursor:pointer}.name{margin-left:14px;flex:1;font-weight:650;cursor:pointer}.bell{width:36px;height:36px;border:0;border-radius:10px;background:var(--gray);color:#68727c;cursor:pointer}.bell.set{background:#f6c644;color:#604900}.done .check{background:var(--green);border-color:var(--green)}.done .name{color:#90989b;text-decoration:line-through 2px var(--red)}.backdrop{display:none;position:fixed;inset:0;z-index:5;background:#10182035;backdrop-filter:blur(7px)}.backdrop.show{display:block}.panel{display:none;position:absolute;z-index:6;top:98px;right:48px;width:min(300px,calc(100% - 48px));padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 14px 42px #0004}.panel.show{display:grid;gap:10px}.panel b{font-size:.87rem}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.primary{padding:11px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}.dark{--bg:#101820;--card:#17212b;--ink:#edf2f7;--muted:#b4c0cc;--line:#314151;--gray:#2a3948}.dark main{background:radial-gradient(circle at 8% 10%,#3b2b22,transparent 28rem),radial-gradient(circle at 92% 88%,#173b32,transparent 28rem)}.dark .row,.dark input{background:#1d2a36}.dark .bar{background:#314151}@media(max-width:500px){.app{padding:36px 24px}.actions{top:25px;right:24px}.panel{top:82px;right:24px}h1{font-size:2.7rem;padding-right:90px}}
</style></head><body><div class="backdrop" id="shade"></div><main><section class="app"><div class="eyebrow">DAILY FOCUS</div><div class="actions"><button class="round" id="add" aria-label="Add routine">+</button><button class="round" id="theme" aria-label="Dark mode">☾</button></div><h1>Routins</h1><p id="status"></p><div class="progress"><div class="bar"><i id="fill"></i></div><b id="pct"></b></div><p class="hint">Swipe left once to reveal Delete. Swipe again to remove.</p><ul id="tasks"></ul><form class="panel" id="addPanel"><b>Add a new routine</b><input id="newTask" placeholder="Add a new routine" maxlength="80"><button class="primary">Add routine</button></form><div class="panel" id="reminderPanel"><b>Set a reminder</b><input id="time" type="time"><button class="primary" id="save">Save reminder</button></div><p class="hint">Completed routines reset automatically at the start of each new day.</p></section></main><script>
const K='routins-final',today=()=>new Intl.DateTimeFormat('en-CA').format(new Date()),defaults=[['water','Drink 2 liters of water'],['move','Move for 30 minutes'],['read','Read for 20 minutes']].map(([id,name])=>({id,name}));let data={day:today(),items:defaults,done:[]},selected=null;try{let x=JSON.parse(localStorage.getItem(K));if(x)data={day:today(),items:x.items||defaults,done:x.day===today()?x.done||[]:[]}}catch{}const save=()=>localStorage.setItem(K,JSON.stringify(data)),q=s=>document.querySelector(s),list=q('#tasks'),shade=q('#shade'),addPanel=q('#addPanel'),reminder=q('#reminderPanel');function close(){shade.classList.remove('show');addPanel.classList.remove('show');reminder.classList.remove('show')}function open(p){close();p.classList.add('show');shade.classList.add('show')}function render(){let n=data.items.length,d=data.done.length,p=n?Math.round(d/n*100):0;q('#status').textContent=n?(d===n?"Great! All of today's routines are complete.":`${n-d} routine${n-d===1?'':'s'} left.`):'Add a routine to start your day.';q('#pct').textContent='%'+p;q('#fill').style.width=p+'%';list.innerHTML='';data.items.forEach(item=>{let done=data.done.includes(item.id),li=document.createElement('li');li.className='task'+(done?' done':'');li.innerHTML=`<div class="delete">Delete</div><div class="row"><span class="check">${done?'✓':''}</span><span class="name"></span><button class="bell ${item.time?'set':''}">🔔</button></div>`;li.querySelector('.name').textContent=item.name;let toggle=()=>{data.done=done?data.done.filter(x=>x!==item.id):[...data.done,item.id];save();render()};li.querySelector('.check').onclick=toggle;li.querySelector('.name').onclick=toggle;li.querySelector('.bell').onclick=e=>{e.stopPropagation();if(reminder.classList.contains('show'))return close();selected=item.id;q('#time').value=item.time||'';open(reminder)};let start=0,armed=false;li.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;start=e.clientX});li.addEventListener('pointermove',e=>{if(!start)return;let dist=Math.max(0,Math.min(96,start-e.clientX));li.querySelector('.row').style.transform=`translateX(-${dist}px)`});li.addEventListener('pointerup',e=>{let dist=start-e.clientX;if(dist>80&&armed){data.items=data.items.filter(x=>x.id!==item.id);data.done=data.done.filter(x=>x!==item.id);save();render()}else if(dist>80){armed=true;li.querySelector('.row').style.transform='translateX(-96px)'}else li.querySelector('.row').style.transform='translateX(0)';start=0});li.querySelector('.delete').onclick=()=>{data.items=data.items.filter(x=>x.id!==item.id);data.done=data.done.filter(x=>x!==item.id);save();render()};list.append(li)})}q('#add').onclick=()=>addPanel.classList.contains('show')?close():open(addPanel);q('#addPanel').onsubmit=e=>{e.preventDefault();let name=q('#newTask').value.trim();if(!name)return;data.items.push({id:crypto.randomUUID(),name});q('#newTask').value='';save();close();render()};q('#save').onclick=()=>{let item=data.items.find(x=>x.id===selected);if(item&&q('#time').value){item.time=q('#time').value;save()}close();render()};shade.onclick=close;q('#theme').onclick=()=>{document.body.classList.toggle('dark');q('#theme').textContent=document.body.classList.contains('dark')?'☀':'☾'};function bell(){let c=new (AudioContext||webkitAudioContext)();[0,.16,.32].forEach(t=>{let o=c.createOscillator(),g=c.createGain();o.frequency.value=1175;g.gain.setValueAtTime(.18,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.45);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.48)})}setInterval(()=>{let now=new Date(),time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');if(data.items.some(x=>x.time===time))bell()},30000);render();
</script><style>.bell{color:#e87924}.bell.set{background:#f6c644;color:#8a4300}.panel .primary,#save,.dark #save{background:#fff;color:#ba6b35;border:1px solid #f0c398}.row[draggable="true"]{cursor:grab}.row.dragging{opacity:.45}.task.drop-target{outline:2px solid #e87924;outline-offset:2px}.row:before{content:'';width:14px;height:16px;flex:0 0 14px;margin-right:12px;opacity:.42;background:repeating-linear-gradient(to bottom,transparent 0 2px,#8b959d 2px 4px,transparent 4px 6px)}#reminderPanel + .hint{margin-top:2em}.progress + .hint{display:none}</style><script>document.querySelector('#save').textContent='Save Reminder';document.querySelector('#addPanel .primary').textContent='Add Routine';let alarmContext,lastAlarm='';document.querySelector('#save').addEventListener('click',()=>{alarmContext??=new (window.AudioContext||window.webkitAudioContext)();alarmContext.resume()});function ringAlarm(){if(!alarmContext)return;[0,.2,.4].forEach(delay=>{const oscillator=alarmContext.createOscillator(),gain=alarmContext.createGain();oscillator.frequency.setValueAtTime(1050,alarmContext.currentTime+delay);oscillator.frequency.exponentialRampToValueAtTime(720,alarmContext.currentTime+delay+.42);gain.gain.setValueAtTime(.001,alarmContext.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.25,alarmContext.currentTime+delay+.02);gain.gain.exponentialRampToValueAtTime(.001,alarmContext.currentTime+delay+.45);oscillator.connect(gain).connect(alarmContext.destination);oscillator.start(alarmContext.currentTime+delay);oscillator.stop(alarmContext.currentTime+delay+.5)})}setInterval(()=>{const now=new Date(),clock=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),key=today()+clock;if(key!==lastAlarm&&data.items.some(item=>item.time===clock)){lastAlarm=key;ringAlarm()}},1000);</script><script>let alarmLoop=null;const stop=document.createElement('button');stop.textContent='Stop Alarm';stop.className='primary';stop.style.cssText='display:none;position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);padding:15px 24px;background:#dd554c;color:#fff;border:0;border-radius:12px;font-size:16px';document.body.append(stop);function startPersistentAlarm(){if(alarmLoop)return;ringAlarm();stop.style.display='block';alarmLoop=setInterval(ringAlarm,1500)}function stopPersistentAlarm(){clearInterval(alarmLoop);alarmLoop=null;stop.style.display='none'}stop.onclick=stopPersistentAlarm;setInterval(()=>{const now=new Date(),clock=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),key='persistent-'+today()+clock;if(key!==lastAlarm&&data.items.some(item=>item.time===clock)){lastAlarm=key;startPersistentAlarm()}},1000);</script></body></html>
